<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('main.index') }}">
      <i class="bi bi-heart-pulse-fill me-1"></i> PoshanSathi
    </a>
    <span class="navbar-text text-white-50 small d-none d-lg-inline ms-2">
      Smart Nutrition &amp; Welfare Tracking System
    </span>

    <div class="ms-auto d-flex align-items-center gap-2 gap-md-3">
      {% if current_user %}
        <a class="btn btn-sm btn-outline-light position-relative"
           href="{{ url_for('notifications.index') }}" title="Notifications">
          <i class="bi bi-bell"></i>
          {% if UnreadNotifications %}
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">
            {{ UnreadNotifications }}
          </span>
          {% endif %}
        </a>
        <span class="badge text-bg-light">
          {{ role_labels.get(current_user.role, current_user.role.value) }}
        </span>
        <span class="text-white small d-none d-md-inline">
          <i class="bi bi-person-circle me-1"></i>{{ current_user.full_name }}
        </span>
        <form method="post" action="{{ url_for('auth.logout') }}" class="mb-0">
          <button type="submit" class="btn btn-sm btn-outline-light">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
          </button>
        </form>
      {% else %}
        <a class="btn btn-sm btn-light" href="{{ url_for('auth.login') }}">
          <i class="bi bi-box-arrow-in-right me-1"></i>Login
        </a>
      {% endif %}
    </div>
  </div>
</nav>
