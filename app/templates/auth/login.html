{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock display-5 text-success"></i>
          <h1 class="h4 mt-2 mb-1">Sign in to PoshanSathi</h1>
          <p class="text-muted small mb-0">
            Demonstration system &middot; synthetic data only
          </p>
        </div>

        <form method="post" action="{{ url_for('auth.login') }}" novalidate>
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   value="{{ username or '' }}" autocomplete="username" required autofocus>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" value="on"
                   id="remember" name="remember">
            <label class="form-check-label" for="remember">Keep me signed in</label>
          </div>

          <button type="submit" class="btn btn-success w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-muted small mt-3 mb-0">
      Demo accounts: <code>admin</code>, <code>supervisor1</code>,
      <code>aww1</code>, <code>officer</code> &mdash; password
      <code>password123</code>
    </p>
  </div>
</div>
{% endblock %}
